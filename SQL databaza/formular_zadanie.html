<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulár zadania</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="formular_zadanie.css">
  <script src="app.js" defer></script>
  <script src="formular_zadanie.js" defer></script>
</head>
<body>
  <main>
    <h1>Registrácia do najlepšej stránky</h1>
    <div class="formular-a-nahled">
      <form id="signupForm">
        <label for="fname">Meno a priezvisko:</label><br>
        <input type="text" id="fname" name="fname"><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email"><br>

        <label for="phone">Telefónne číslo:</label><br>
        <input type="tel" id="phone" name="phone"><br>

        <label for="datum">Dátum narodenia:</label><br>
        <input type="date" id="datum" name="datum"><br>

        <label for="course">Kurz:</label><br>
        <select id="course" name="course">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
        </select><br>

        <label>Úroveň:</label><br>
        <input type="radio" id="beginner" name="level" value="Začiatočník">
        <label for="beginner">Začiatočník</label><br>
        <input type="radio" id="intermediate" name="level" value="Mierne pokročilý">
        <label for="intermediate">Mierne pokročilý</label><br>
        <input type="radio" id="advanced" name="level" value="Pokročilý">
        <label for="advanced">Pokročilý</label><br>

        <label for="note">Poznámka:</label><br>
        <textarea id="note" name="note"></textarea><br>

        <input type="checkbox" id="agree" name="agree">
        <label for="agree">Súhlas s podmienkami</label><br>

        <button type="submit">Odoslať formulár</button>
      </form>

      <section class="nahled">
        <h2>Náhľad registrácie</h2>
        <p>Meno a priezvisko: <span id="previewName">-</span></p>
        <p>E-mail: <span id="previewEmail">-</span></p>
        <p>Kurz: <span id="previewCourse">HTML</span></p>
        <p>Úroveň: <span id="previewLevel">-</span></p>
        <p>Poznámka: <span id="previewNote">-</span></p>
      </section>
    </div>
  </main>
</body>
</html>
